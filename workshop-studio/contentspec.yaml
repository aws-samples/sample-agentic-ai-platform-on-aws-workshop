# Sample Workshop Studio content specification for this workshop (copy into the workshop content repository root).
# Workshop Studio reads this file from the content repository; the files it references live under static/ there:
#   static/deployer.yaml          <- workshop-studio/deployer.yaml (this repository)
#   static/repo.zip               <- build/workshop-studio/repo.zip (scripts/package_for_workshop_studio.py)
#   static/attendee-policy.json   <- workshop-studio/attendee-policy.json
# Workshop Studio uploads static/ to the event assets bucket and substitutes {{.AssetsBucketName}} / {{.AssetsBucketPrefix}}
# when it creates the stack in every attendee account. Check the field names against the current Workshop Studio
# documentation when the event is created (format version 2.0 as of October 2026).
version: 2.0
defaultLocaleCode: en-US
localeCodes:
  - en-US

awsAccountConfig:
  accountSources:
    - WorkshopStudio
  participantRole:
    iamPolicies:
      - static/attendee-policy.json
  regionConfiguration:
    minAccessibleRegions: 1
    maxAccessibleRegions: 1
    accessibleRegions:
      required:
        - us-east-1
    deployableRegions:
      required:
        - us-east-1

infrastructure:
  cloudformationTemplates:
    - templateLocation: static/deployer.yaml
      label: Agentic AI Platform control plane and sample data (CDK via CodeBuild, about 12 minutes; learners deploy the landing zone in module 1)
      parameters:
        - templateParameter: AssetsBucketName
          defaultValue: "{{.AssetsBucketName}}"
        - templateParameter: AssetsBucketPrefix
          defaultValue: "{{.AssetsBucketPrefix}}"
      participantVisibleStackOutputs:
        - UiUrl
        - ApiUrl
        - ModelGatewayUrl
        - UsersSecretArn
        - PersonaPasswordsCommand
        - DoctorStatus
        - DeployerBuildLogs
