[project]
name = "platform-sdk"
version = "0.1.0"
description = "Shared helpers for the workshop agentic AI platform: configuration discovery, naming, blueprint rendering, platform API and model gateway clients"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.108",
    "pyyaml>=6.0.3",
    "requests>=2.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_sdk"]
