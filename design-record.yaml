# Your platform design record. One block per module, two parts:
#   inputs    read by `workshop apply N` (bold on the course pages): they shape the platform you build today
#   decisions what this workshop chose for each decision; the course pages show the recommended reference option beside it
# Missing inputs fall back to the workshop defaults, so this file builds the reference platform as it is.
# Decisions are never sent anywhere; keep personal or company-confidential notes out of this file.
# Check it any time with `workshop record`.

module_1:
  inputs: none                                  # workshop apply 1 deploys the landing zone as designed (network, shared services, model gateway)
  decisions:
    accounts: {workshop: one-account}             # Dev and Prod by name; reference: platform + workload accounts
    network:  {workshop: private-endpoints}       # one private VPC, endpoints only: no internet path

module_2:
  inputs:                                       # read by: workshop apply 2 and workshop obo
    employee: E1001                             # the employee who signs in at the corporate IdP; the on-behalf-of chain acts for this person
  decisions:
    people:        {workshop: cognito-groups}            # three groups are the three personas; reference: corporate IdP brokered
    agents:        {workshop: iam-sigv4 + obo-jwt}       # SigV4 for Dev and Prod; a realm token for the on-behalf-of twin
    secrets:       {workshop: token-vault}               # API key per agent, environment and model; OAuth2 providers for the exchange
    user_identity: {workshop: obo-token-exchange}        # RFC 8693 at each hop through Keycloak, brokered by AgentCore Identity

module_3:
  inputs:                                       # read by: workshop apply 3
    domain: people-ops
    project: hr-assistant
    owner: margaret.chen@anycompany.example     # synthetic owner of the sample domain
    models: [claude-sonnet-5, gpt-6-1-sol]           # two vendors for this project; claude-opus-5 and nova-2-lite stay approved only
    model: claude-sonnet-5                      # the alias the agent uses (one of models)
    budget: {usd: 5, period: 7d, tpm: 200000, rpm: 200}
  decisions:
    tenancy:    {workshop: templates}
    governance: {workshop: layered}
    registry:   {workshop: one-registry}            # AWS Agent Registry; every persona reads; the admin approves

module_4:
  inputs:                                       # read by: workshop apply 4
    knowledge_filter: {department: HR}          # pinned at the knowledge base target
    max_leave_days: 10                          # the argument rule in Cedar
    gateway_mode: LOG_ONLY                      # where every gateway starts; you flip HR Dev to ENFORCE on the Governance screen
  decisions:
    topology:     {workshop: per-project}                # one gateway set per project
    environments: {workshop: dev-prod-gateways}          # each project gateway exists once per environment
    tool_access:  {workshop: audience-check + cedar-iam} # the IdP issues tokens per audience; each authorizer checks it; Cedar on the IAM route only
    rollout:      {workshop: log-then-enforce}

module_5:
  inputs:                                       # read by: workshop apply 5
    key_cap: {usd: 1.00, period: 7d}            # the Dev key for the agent's model
  decisions:
    model_access:        {workshop: model-gateway}           # LiteLLM
    spend_control:       {workshop: team-budget + key-caps}  # project team budget + one capped key per agent, environment and model
    processing_location: {workshop: geographic-profiles}     # us. profiles; the SCP side is 3.2

module_6:
  inputs:                                       # read by: workshop apply 6 and workshop export
    prompt_version: v1                          # v1 has the planted bug; set v2 to fix it, then apply again
    thresholds: {Correctness: 0.8, GoalSuccessRate: 0.9, TrajectoryInOrderMatch: 0.9, Harmfulness: 0.0}
    export: strands                             # strands | langgraph
  decisions:
    project_freedom: {workshop: blueprint-path}             # Harness from a YAML blueprint; export is the way out
    infrastructure:  {workshop: cdk + control-plane}        # 7 platform stacks + the IdP stand-in; per-project objects at run time
    operating_model: {workshop: federated}                  # the platform team shares, project teams build, the domain accepts
    pipeline_owner:  {workshop: platform-pipeline}          # one CodePipeline the platform owns
    approvals:       {workshop: admin-catalogue + domain-release}
    release_gate:    {workshop: evaluation + human-approval}
    promotion:       {workshop: default-endpoint}

module_7:
  inputs:                                       # read by: workshop apply 7
    prod_traffic: 10                            # conversations sent to Prod
  decisions:
    observability:     {workshop: transaction-search}
    evaluation:        {workshop: pipeline-gate + online-at-promotion}  # offline dataset in the pipeline; online on Prod traffic
    telemetry_content: {workshop: full-content}           # synthetic data; reference: metadata only in production
    cost_allocation:   {workshop: measured-consumption}   # per key; the foundation unallocated
  backlog:                                      # your production path: one line per recap row, with an owning team
    - "accounts: platform + workload accounts, owner: cloud team"
    - "identity: brokered corporate IdP, owner: identity team"
    - "..."
