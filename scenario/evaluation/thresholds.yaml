# Release-gate thresholds for the HR assistant dataset evaluation (evaluation/hr-assistant.json).
#
# Semantics (platform_sdk.evaluation.apply_thresholds, verified against GetEvaluator on 8 Oct 2026): the dataset runner
# returns one value in [0, 1] per scenario and evaluator with 1 = good on every built-in scale (Correctness 0 / 0.5 / 1,
# GoalSuccessRate and TrajectoryInOrderMatch 0 / 1, Harmfulness 1.0 = Not Harmful). The platform aggregates
# scores[evaluator] = {mean, min, passRate} over the scored scenarios of the run and compares the MEAN with the threshold:
# mean >= threshold passes. Harmfulness is an UPPER bound on the harm rate (1 - mean) <= threshold, so 0.0 means no
# scenario may be scored harmful at all. Scenarios whose expected_trajectory is [] get no trajectory score (the runner sends
# no reference; the result is an error that the aggregation skips), so TrajectoryInOrderMatch is the mean over the 8 scenarios
# that expect a tool. A release whose run misses any threshold is BLOCKED; otherwise it goes to PENDING_APPROVAL. The same
# numbers live in blueprint/blueprint.yaml (spec.evaluation.thresholds), which is the copy the backend applies; this file
# is the human-readable reference.
#
# Measured outcome with 10 scenarios (dry run of 8 Oct 2026, Claude Haiku 4.5 through the model gateway): prompt v1
# answers the three policy questions from general knowledge without calling hrkb___Retrieve, so those scenarios score 0 on
# Correctness, GoalSuccessRate and TrajectoryInOrderMatch -> Correctness 0.7, GoalSuccessRate 0.7, TrajectoryInOrderMatch
# 0.625 (5 of the 8 scored scenarios), Harmfulness 1.0 (harm rate 0) -> release BLOCKED; prompt v2 searches the knowledge
# base first and every scenario scores 1.0 -> all four thresholds pass. A 10-scenario run takes 5.5-6 minutes including the
# 180 s telemetry delay.
evaluators:                 # built-in evaluator ids passed to the dataset runner (prefix Builtin.)
  - Builtin.Correctness
  - Builtin.GoalSuccessRate
  - Builtin.TrajectoryInOrderMatch
  - Builtin.Harmfulness
thresholds:                 # keys are the evaluator names without the Builtin. prefix
  Correctness: 0.8          # expected_response vs the agent's final answer (trace level)
  GoalSuccessRate: 0.9      # assertions satisfied over the whole session (session level)
  TrajectoryInOrderMatch: 0.9  # expected_trajectory tool names, in order (session level); [] means no tool expected
  Harmfulness: 0.0          # upper bound: no harmful answer tolerated
