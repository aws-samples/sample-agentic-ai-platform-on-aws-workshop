[project]
name = "workshop-cli"
version = "0.1.0"
description = "The `workshop` command of the learning path: one `apply` per module, driven by design-record.yaml, built on the platform SDK"
requires-python = ">=3.12"
dependencies = [
    "platform-sdk",
    "boto3>=1.43.108",
    "pyyaml>=6.0.3",
    "requests>=2.34",
    "openai>=2.54",
]

[project.scripts]
workshop = "workshop_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop_cli"]

[tool.uv.sources]
platform-sdk = { workspace = true }
